# Configuration de la source de données
spring.datasource.url=jdbc:mysql://localhost:3306/dental_clinic?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration JWT
app.jwt.secret=votreCléSecrèteTrèsLongueEtComplexePourLaProductionAuMoins256Bits
app.jwt.expiration=86400000 

# Configuration du logging
logging.level.org.springframework.security=DEBUG
logging.level.com.saas.dental_clinic=DEBUG

# Configuration du serveur
server.error.include-message=always
server.error.include-binding-errors=always